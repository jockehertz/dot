source = ~/.config/hypr/macchiato.conf
exec-once = swaybg -i ~/.config/hypr/wallpaper.png
exec-once = waybar
exec-once = systemctl start --user ssh-agent
exec-once = ssh-add ~/.ssh/id_rsa_proton
exec-once = ssh-add ~/.ssh/id_rsa
input {
  kb_layout = se
  kb_options = caps:escape
  touchpad {
  	natural_scroll = true
  }
}

monitor = eDP-1, 1920x1200, 0x0, 1.25

# Keybinds
bind = SUPER, Return, exec, ghostty
bind = SUPER, Q, killactive
bind = SUPER, Space, exec, rofi -show drun

# workspaces
bind = SUPER, 1, workspace, 1 
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7


# window operations
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r
bind = SUPER_Shift, H, movewindow, l 
bind = SUPER_Shift, J, movewindow, d
bind = SUPER_Shift, K, movewindow, u
bind = SUPER_Shift, L, movewindow, r

# brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- --min-value=5

# audio control
bind = , XF86AudioRaiseVolume, exec, amixer set Master 5%+
bind = , XF86AudioLowerVolume, exec, amixer set Master 5%-
bind = , XF86AudioMute, exec, amixer set Master toggle

xwayland {
  force_zero_scaling = true
}
env = GDK_SCALE, 1.25          # for GTK apps
env = QT_SCALE_FACTOR, 1.25    # for Qt apps  
